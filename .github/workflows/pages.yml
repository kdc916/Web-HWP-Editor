name: Manual Web HWP Editor Build

# Normal commits no longer build/deploy automatically.
# GitHub Pages production is served from main/docs after migration.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Manual build notice
        run: |
          echo "Production Pages is branch-based (main/docs)."
          echo "This workflow is intentionally manual only."
          echo "Build/test release artifacts separately, then replace docs/ after verification."
