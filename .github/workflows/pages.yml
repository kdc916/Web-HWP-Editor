name: Deploy Web HWP Editor to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Web HWP Editor
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web HWP Editor shell
        run: npm run build

      - name: Fetch pinned rhwp Studio v0.8.6
        run: |
          set -euo pipefail
          mkdir -p .rhwp
          curl -sSfL --retry 5 --retry-delay 2 \
            -o /tmp/rhwp-v0.8.6.tar.gz \
            https://github.com/edwardkim/rhwp/archive/refs/tags/v0.8.6.tar.gz
          tar -xzf /tmp/rhwp-v0.8.6.tar.gz --strip-components=1 -C .rhwp

      - name: Install pinned wasm-pack 0.15.0
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          WASM_PACK_VERSION=0.15.0
          TARBALL="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          URL="https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${TARBALL}.tar.gz"
          TMPDIR="$(mktemp -d)"
          curl -sSfL --retry 5 --retry-delay 2 -o "${TMPDIR}/wasm-pack.tar.gz" "${URL}"
          tar -xzf "${TMPDIR}/wasm-pack.tar.gz" -C "${TMPDIR}"
          mkdir -p "${HOME}/.cargo/bin"
          cp "${TMPDIR}/${TARBALL}/wasm-pack" "${HOME}/.cargo/bin/wasm-pack"
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build rhwp WASM
        working-directory: .rhwp
        run: |
          wasm-pack build --target web --out-dir pkg --release --locked

      - name: Build self-hosted rhwp Studio
        working-directory: .rhwp/rhwp-studio
        env:
          RHWP_DISABLE_EXTERNAL_WEBFONTS: "1"
        run: |
          npm install --no-audit --no-fund
          npx tsc
          npx vite build --base=/Web-HWP-Editor/studio/

      - name: Bundle Studio into Web HWP Editor
        run: |
          mkdir -p dist/studio
          cp -R .rhwp/rhwp-studio/dist/. dist/studio/
          touch dist/.nojekyll

      - name: Package source
        run: |
          zip -r Web-HWP-Editor_v0.4.0_Source.zip .             -x ".git/*" ".rhwp/*" "node_modules/*" "dist/*" "Web-HWP-Editor_v0.4.0_Source.zip"

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: Web-HWP-Editor-v0.4.0-Source
          path: Web-HWP-Editor_v0.4.0_Source.zip
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
