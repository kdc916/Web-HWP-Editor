name: Deploy Web HWP Editor to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  RHWP_PINNED_COMMIT: "6b3faf77d8085441f9f26d88d65a49791e910352"
  WASM_PACK_VERSION: "0.15.0"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Web HWP Editor
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web HWP Editor shell
        run: npm run build

      - name: Fetch pinned rhwp reliability core
        run: |
          set -euo pipefail
          rm -rf .rhwp
          git init .rhwp
          git -C .rhwp remote add origin https://github.com/edwardkim/rhwp.git
          git -C .rhwp config core.sparseCheckout true
          mkdir -p .rhwp/.git/info
          cat > .rhwp/.git/info/sparse-checkout <<'SPARSE'
          /*
          !/*/
          /src/
          /crates/
          /vendor/
          /rhwp-studio/
          !/rhwp-studio/public/samples/
          /rhwp-shared/
          /assets/
          /saved/
          /ttfs/opensource/
          /mydocs/manual/
          /mydocs/tech/agent_roadmap/
          /samples/issue1949_giant_cell_nested_tables_perf.hwp
          /scripts/
          /npm/editor/
          /bindings/Native/
          /tools/rhwp-subsecond/
          /tools/batch-convert/
          /tools/llm_verifier/verdict_protocol/
          /tools/llm_verifier/claim_bind/
          /tools/llm_verifier/criteria_decomp/
          /web/
          /tests/
          SPARSE
          git -C .rhwp fetch --depth=1 --filter=blob:none origin "${RHWP_PINNED_COMMIT}"
          git -C .rhwp checkout --detach FETCH_HEAD
          test "$(git -C .rhwp rev-parse HEAD)" = "${RHWP_PINNED_COMMIT}"

      - name: Verify pinned document and table fixes
        run: |
          set -euo pipefail
          test -f .rhwp/tests/issue_4138_split_cell_stale_linesegs.rs
          grep -q "split_cell_into_reflows_stale_segs_and_rebuilds_ladder" .rhwp/tests/issue_4138_split_cell_stale_linesegs.rs
          grep -q "reflow_stale_cells_after_split" .rhwp/tests/issue_4138_split_cell_stale_linesegs.rs
          grep -q "id: 'file:new-doc'" .rhwp/rhwp-studio/src/command/commands/file.ts
          grep -q "id: 'page:break'" .rhwp/rhwp-studio/src/command/commands/page.ts
          grep -q "id: 'table:create'" .rhwp/rhwp-studio/src/command/commands/table.ts
          grep -q "id: 'table:cell-split'" .rhwp/rhwp-studio/src/command/commands/table.ts
      - name: Apply Web HWP Editor table safety patch
        run: |
          set -euo pipefail
          node scripts/patch-embedded-studio.mjs .rhwp
          node scripts/verify-table-safety.mjs .rhwp
          cp tests/web_hwp_table_integrity_regression.rs .rhwp/tests/web_hwp_table_integrity_regression.rs
          cat >> .rhwp/Cargo.toml <<'TEST_TARGETS'

          [[test]]
          name = "web_hwp_table_integrity_regression"
          path = "tests/web_hwp_table_integrity_regression.rs"

          [[test]]
          name = "issue_4138_split_cell_stale_linesegs"
          path = "tests/issue_4138_split_cell_stale_linesegs.rs"

          [[test]]
          name = "issue_4323_merge_cell_reflow"
          path = "tests/issue_4323_merge_cell_reflow.rs"
          TEST_TARGETS

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install pinned wasm-pack
        run: |
          set -euo pipefail
          TARBALL="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          URL="https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${TARBALL}.tar.gz"
          TMPDIR="$(mktemp -d)"
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "${TMPDIR}/wasm-pack.tar.gz" "${URL}"
          tar -xzf "${TMPDIR}/wasm-pack.tar.gz" -C "${TMPDIR}"
          mkdir -p "${HOME}/.cargo/bin"
          cp "${TMPDIR}/${TARBALL}/wasm-pack" "${HOME}/.cargo/bin/wasm-pack"
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          "${HOME}/.cargo/bin/wasm-pack" --version

      - name: Cache rhwp Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .rhwp/target
          key: ${{ runner.os }}-rhwp-${{ env.RHWP_PINNED_COMMIT }}-${{ hashFiles('.rhwp/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rhwp-${{ env.RHWP_PINNED_COMMIT }}-
            ${{ runner.os }}-rhwp-

      - name: Run focused table integrity regression tests
        working-directory: .rhwp
        run: |
          cargo test --release --test web_hwp_table_integrity_regression -- --nocapture
          cargo test --release --test issue_4138_split_cell_stale_linesegs -- --nocapture
          cargo test --release --test issue_4323_merge_cell_reflow -- --nocapture
      - name: Build pinned rhwp WASM
        working-directory: .rhwp
        run: wasm-pack build --target web --release

      - name: Stage fresh WASM into Studio
        run: |
          cp .rhwp/pkg/rhwp_bg.wasm .rhwp/rhwp-studio/public/rhwp_bg.wasm
          cp .rhwp/pkg/rhwp.js .rhwp/rhwp-studio/public/rhwp.js
          cp .rhwp/pkg/rhwp.d.ts .rhwp/rhwp-studio/public/rhwp.d.ts

      - name: Build self-hosted pinned rhwp Studio
        working-directory: .rhwp/rhwp-studio
        env:
          RHWP_DISABLE_EXTERNAL_WEBFONTS: "1"
          RHWP_WITHOUT_HWPCTRL: "1"
        run: |
          npm install --no-audit --no-fund
          npx tsc
          npx vite build --base=/Web-HWP-Editor/studio-v051/

      - name: Bundle Studio into Web HWP Editor
        run: |
          mkdir -p dist/studio-v051
          cp -R .rhwp/rhwp-studio/dist/. dist/studio-v051/
          printf "%s\n" "${RHWP_PINNED_COMMIT}" > dist/RHWP_CORE_COMMIT.txt
          touch dist/.nojekyll

      - name: Package source
        run: |
          zip -r Web-HWP-Editor_v0.5.1_Source.zip . \
            -x ".git/*" ".rhwp/*" "node_modules/*" "dist/*" "Web-HWP-Editor_v0.5.1_Source.zip"

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: Web-HWP-Editor-v0.5.1-Source
          path: Web-HWP-Editor_v0.5.1_Source.zip
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
