<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="브라우저에서 HWPX 문서를 열고 간단히 수정하는 로컬 우선 웹 편집기" />
  <title>Web HWP Editor</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">한</div>
      <div>
        <h1>Web HWP Editor</h1>
        <p>Local-first HWPX editor</p>
      </div>
    </div>

    <div class="header-actions">
      <input id="fileInput" type="file" accept=".hwpx,application/zip" hidden />
      <button id="openButton" class="button button-primary" type="button">HWPX 열기</button>
      <button id="saveButton" class="button" type="button" disabled>HWPX 저장</button>
    </div>
  </header>

  <main class="app-shell">
    <section class="info-bar" aria-live="polite">
      <div>
        <strong id="documentName">문서를 열어주세요</strong>
        <span id="documentMeta">HWPX 파일을 이 창에 끌어놓아도 됩니다.</span>
      </div>
      <span class="privacy-badge">문서 서버 전송 없음</span>
    </section>

    <section id="dropZone" class="workspace" tabindex="0">
      <div id="emptyState" class="empty-state">
        <div class="empty-icon" aria-hidden="true">HWPX</div>
        <h2>HWPX 파일을 여기에 놓으세요</h2>
        <p>현재 v0.1은 HWPX 문서의 텍스트와 표 셀을 로컬 브라우저에서 편집합니다.</p>
        <button id="emptyOpenButton" class="button button-primary" type="button">파일 선택</button>
        <ul>
          <li>파일은 브라우저 안에서만 처리됩니다.</li>
          <li>원본 HWPX 구조와 이미지·스타일 리소스를 최대한 유지합니다.</li>
          <li>복잡한 개체/페이지 레이아웃은 후속 버전에서 확장합니다.</li>
        </ul>
      </div>

      <div id="editorViewport" class="editor-viewport" hidden>
        <div class="editor-toolbar" role="toolbar" aria-label="편집 도구">
          <button id="undoButton" class="tool-button" type="button" title="실행 취소" disabled>↶</button>
          <button id="redoButton" class="tool-button" type="button" title="다시 실행" disabled>↷</button>
          <span class="toolbar-divider"></span>
          <button id="zoomOutButton" class="tool-button" type="button" title="축소">−</button>
          <span id="zoomLabel" class="zoom-label">100%</span>
          <button id="zoomInButton" class="tool-button" type="button" title="확대">＋</button>
          <span class="toolbar-spacer"></span>
          <span id="editStatus" class="edit-status">편집 준비</span>
        </div>

        <div class="canvas-area">
          <article id="paper" class="paper" aria-label="HWPX 문서 편집 영역"></article>
        </div>
      </div>
    </section>
  </main>

  <footer class="status-bar">
    <span id="statusText">준비됨</span>
    <span>Web HWP Editor v0.1.0</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
